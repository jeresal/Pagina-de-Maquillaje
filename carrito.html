<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito - JyL.Makeupstudio</title>
    <meta name="description" content="Carrito de compras JyL.Makeupstudio"/>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="pagina.css" />
    <style>
        .brand-logo {
            height: 40px;
            width: auto;
            margin-right: 12px;
        }

        .carrito-container {
            padding: 60px 0;
            min-height: 60vh;
        }

        .carrito-vacio {
            text-align: center;
            padding: 60px 20px;
        }

        .carrito-vacio h2 {
            font-size: 2rem;
            margin-bottom: 16px;
        }

        .carrito-vacio p {
            color: var(--muted);
            margin-bottom: 24px;
        }

        .carrito-tabla {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        .carrito-tabla thead {
            background: rgba(255, 123, 188, 0.05);
        }

        .carrito-tabla th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text);
            border-bottom: 2px solid rgba(141, 92, 246, 0.2);
        }

        .carrito-tabla td {
            padding: 16px;
            border-bottom: 1px solid rgba(214, 150, 180, 0.2);
        }

        .item-nombre {
            font-weight: 600;
        }

        .cantidad-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cantidad-btn {
            background: rgba(141, 92, 246, 0.1);
            border: 1px solid var(--purple);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            color: var(--purple);
            transition: all 0.2s;
        }

        .cantidad-btn:hover {
            background: var(--purple);
            color: white;
        }

        .eliminar-btn {
            background: rgba(255, 79, 163, 0.1);
            border: none;
            color: var(--pink-dark);
            cursor: pointer;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .eliminar-btn:hover {
            background: rgba(255, 79, 163, 0.2);
        }

        .carrito-resumen {
            background: var(--card);
            border: 1px solid rgba(202, 128, 170, 0.18);
            border-radius: 20px;
            padding: 24px;
            max-width: 400px;
            margin-left: auto;
        }

        .resumen-fila {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .resumen-total {
            border-top: 2px solid rgba(141, 92, 246, 0.2);
            padding-top: 12px;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--pink-dark);
        }

        .carrito-acciones {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .carrito-acciones a {
            flex: 1;
            text-align: center;
            padding: 14px;
            border-radius: 20px;
            font-weight: 600;
            transition: all 0.2s;
            display: block;
        }

        .btn-continuar {
            background: rgba(141, 92, 246, 0.1);
            color: var(--purple);
            border: 2px solid var(--purple);
        }

        .btn-continuar:hover {
            background: var(--purple);
            color: white;
        }

        .btn-comprar {
            background: linear-gradient(135deg, var(--pink), var(--purple));
            color: white;
            border: none;
        }

        .btn-comprar:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(184, 80, 144, 0.3);
        }

        @media (max-width: 768px) {
            .carrito-tabla {
                font-size: 0.9rem;
            }

            .carrito-tabla th,
            .carrito-tabla td {
                padding: 10px;
            }

            .carrito-resumen {
                max-width: 100%;
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="container nav">
            <div class="brand">
                <img src="img-paginas/logo.jpg" alt="JyL.Makeupstudio Logo" class="brand-logo">
                <span>JyL.Makeupstudio</span>
            </div>

            <nav class="nav-links" aria-label="Navegación principal">
                <a href="pagina.html">Inicio</a>
                <a href="pagina.html#catalogo">Catálogo</a>
                <a href="pagina.html#contacto">Contacto</a>
                <a href="carrito.html" class="carrito-link">
                    🛒 Carrito
                    <span id="carrito-badge" class="carrito-badge">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main id="carrito-main">
        <div class="container carrito-container">
            <h1 style="margin-bottom: 30px;">Tu Carrito de Compras</h1>
            <div id="carrito-contenido"></div>
        </div>
    </main>

    <footer id="contacto" class="footer">
        <div class="container footer-content">
            <p>@ JyL.Makeupstudio</p>
            <a
                href="https://wa.me/5493513446488?text=Hola%20quiero%20más%20información"
                target="_blank"
                rel="noopener noreferrer"
                >WhatsApp: +54 9 351-3446488</a
            >
        </div>
    </footer>

    <script>
        let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

        function actualizarContadorCarrito() {
            const contador = carrito.reduce((total, item) => total + item.cantidad, 0);
            const badge = document.getElementById("carrito-badge");
            if (badge) {
                badge.textContent = contador;
                badge.style.display = contador > 0 ? "flex" : "none";
            }
        }

        function guardarCarrito() {
            localStorage.setItem("carrito", JSON.stringify(carrito));
            actualizarContadorCarrito();
            renderCarrito();
        }

        function eliminarDelCarrito(nombre) {
            carrito = carrito.filter(item => item.nombre !== nombre);
            guardarCarrito();
        }

        function actualizarCantidad(nombre, cantidad) {
            const item = carrito.find(i => i.nombre === nombre);
            if (item) {
                item.cantidad = Math.max(1, cantidad);
                guardasCarrito();
            }
        }

        function calcularTotal() {
            return carrito.reduce((total, item) => total + (item.precioNumerico * item.cantidad), 0).toFixed(2);
        }

        function crearMensajeWhatsApp() {
            let mensaje = "Quiero comprar los siguientes productos:\n\n";
            carrito.forEach((item, i) => {
                mensaje += `${i + 1}. ${item.nombre} x${item.cantidad} - $${(item.precioNumerico * item.cantidad).toFixed(2)}\n`;
            });
            const total = calcularTotal();
            mensaje += `\n*Total: $${total}*`;
            return encodeURIComponent(mensaje);
        }

        function renderCarrito() {
            const contenedor = document.getElementById("carrito-contenido");
            contenedor.innerHTML = "";

            if (carrito.length === 0) {
                contenedor.innerHTML = `
                    <div class="carrito-vacio">
                        <h2>Tu carrito está vacío</h2>
                        <p>Agrega productos para comenzar a comprar</p>
                        <a href="pagina.html#catalogo" class="primary-btn">Ver productos</a>
                    </div>
                `;
                return;
            }

            let tabla = `
                <table class="carrito-tabla">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                            <th>Subtotal</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            carrito.forEach(item => {
                const subtotal = (item.precioNumerico * item.cantidad).toFixed(2);
                tabla += `
                    <tr>
                        <td class="item-nombre">${item.nombre}</td>
                        <td>$${item.precioNumerico.toFixed(2)}</td>
                        <td>
                            <div class="cantidad-control">
                                <button class="cantidad-btn" onclick="actualizarCantidadDesdeTabla('${item.nombre}', ${item.cantidad - 1})">−</button>
                                <span>${item.cantidad}</span>
                                <button class="cantidad-btn" onclick="actualizarCantidadDesdeTabla('${item.nombre}', ${item.cantidad + 1})">+</button>
                            </div>
                        </td>
                        <td>$${subtotal}</td>
                        <td>
                            <button class="eliminar-btn" onclick="eliminarDelCarrito('${item.nombre}')">Eliminar</button>
                        </td>
                    </tr>
                `;
            });

            const total = calcularTotal();
            tabla += `
                    </tbody>
                </table>

                <div class="carrito-resumen">
                    <div class="resumen-fila">
                        <span>Subtotal:</span>
                        <span>$${total}</span>
                    </div>
                    <div class="resumen-fila">
                        <span>Envío:</span>
                        <span>Por consultar</span>
                    </div>
                    <div class="resumen-fila resumen-total">
                        <span>Total:</span>
                        <span>$${total}</span>
                    </div>
                    <div class="carrito-acciones">
                        <a href="pagina.html#catalogo" class="btn-continuar">Seguir comprando</a>
                        <a href="https://wa.me/5493513446488?text=${crearMensajeWhatsApp()}" target="_blank" rel="noopener noreferrer" class="btn-comprar">Comprar por WhatsApp</a>
                    </div>
                </div>
            `;

            contenedor.innerHTML = tabla;
        }

        function actualizarCantidadDesdeTabla(nombre, cantidad) {
            const item = carrito.find(i => i.nombre === nombre);
            if (item) {
                if (cantidad < 1) {
                    eliminarDelCarrito(nombre);
                } else {
                    item.cantidad = cantidad;
                    guardasCarrito();
                }
            }
        }

        function guardasCarrito() {
            localStorage.setItem("carrito", JSON.stringify(carrito));
            actualizarContadorCarrito();
            renderCarrito();
        }

        // Inicializar
        renderCarrito();
        actualizarContadorCarrito();
    </script>
</body>
</html>
